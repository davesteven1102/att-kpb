workflows:
  ios-capacitor-workflow:
    name: Build iOS Capacitor App
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Copy Web Assets & Sync Capacitor iOS
        script: |
          npx cap copy ios
          npx cap sync ios
      - name: CocoaPods Install
        script: |
          cd ios/App
          pod install
      - name: Build iOS App (.ipa)
        script: |
          xcodebuild build \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios/App/build/Release-iphoneos/*.app
      - build/ios/ipa/*.ipa